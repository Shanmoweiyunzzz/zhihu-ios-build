# ============================================================================
#  知乎++ iOS —— 一键编译未签名 IPA
#
#  用法（不需要 Mac、不需要改代码）：
#    1. 在 GitHub 新建一个空仓库（Public / Private 都行，不要勾 README）
#    2. 上传本文件，路径必须是：.github/workflows/build-unsigned-ipa.yml
#    3. 上传后自动开始编译；30~60 分钟后到仓库 Actions 页面下载 artifact
#       （要重跑：Actions -> Build unsigned IPA -> Run workflow）
#
#  本文件是自包含的：它会自己拉上游源码、叠加 iOS 宿主层、打补丁、编译、打包。
#  不需要 fork，也不需要上传其它文件。
# ============================================================================
name: Build unsigned IPA

on:
  push:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游分支/标签/提交（留空则用内置锚点）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 180
    env:
