    steps:
      - name: 1/9 拉取上游源码
        run: |
          set -euxo pipefail
          git clone --depth 1 "$UPSTREAM" src
          cd src
          REF="${{ github.event.inputs.upstream_ref }}"
          if [ -n "${REF:-}" ]; then
            git fetch --depth 1 origin "$REF" && git checkout -q FETCH_HEAD || echo "指定 ref 拉取失败，改用默认分支"
          elif git fetch --depth 1 origin "$UPSTREAM_SHA"; then
            git checkout -q FETCH_HEAD
            echo "已锚定上游提交 $UPSTREAM_SHA"
          else
            echo "锚点拉取失败，改用默认分支 HEAD"
          fi
          git log -1 --oneline
          chmod +x gradlew

      - name: 2/9 叠加 iOS 宿主层
        run: |
          set -euxo pipefail
          python3 -c "import base64,os;open('/tmp/overlay.tar.gz','wb').write(base64.b64decode(os.environ['OVERLAY_B64']))"
          tar xzf /tmp/overlay.tar.gz -C src
          echo '--- iosApp ---'
          find src/iosApp -type f | sort
          echo '--- iosMain 新增文件 ---'
          ls -l src/shared/src/iosMain/kotlin/com/github/zly2006/zhihu/MainViewController.kt \
                src/shared/src/iosMain/kotlin/com/github/zly2006/zhihu/ui/IosZhihuMain.kt \
                src/shared/src/iosMain/kotlin/com/github/zly2006/zhihu/platform/IosSettingsStore.kt

      - name: 3/9 修复「自动隐藏回答标题」失效 + 补依赖
        run: |
          set -euxo pipefail
          cd src
          F=shared/src/iosMain/kotlin/com/github/zly2006/zhihu/platform/NativePlatformBridge.ios.kt
          # 核心修复：返回 noopSettingsStore() 改为真实存储（找不到就报错，绝不静默跳过）
          python3 - "$F" <<'PATCH'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          old = "= noopSettingsStore()"
          new = "= iosSettingsStore(relativePath)"
          if old not in s:
              raise SystemExit("补丁目标未找到: " + old)
          open(p, "w", encoding="utf-8").write(s.replace(old, new))
          PATCH
          grep -n "iosSettingsStore" "$F"
          # nativeMain 用 Ktor Darwin 引擎，iOS 侧缺依赖声明，显式补上
          cat >> shared/build.gradle.kts <<'APPEND'

          // ==== iOS 宿主补丁：Darwin 引擎依赖 ====
          kotlin {
              sourceSets {
                  named("iosMain") {
                      dependencies {
                          implementation("io.ktor:ktor-client-darwin:3.5.0")
                      }
                  }
              }
          }
          APPEND
          tail -14 shared/build.gradle.kts
          # 编译策略调整：in-process 保留完整编译器输出（守护进程崩溃会吞掉真实错误），
          # 关闭 Kotlin/Native 增量编译，放大 Gradle 堆
          python3 - gradle.properties <<'GP'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          s = s.replace("kotlin.compiler.execution.strategy=daemon",
                        "kotlin.compiler.execution.strategy=in-process")
          s = s.replace("kotlin.daemon.jvmargs=-Xmx3072m",
                        "kotlin.daemon.jvmargs=-Xmx8192m")
          if "org.gradle.jvmargs" not in s:
              s += "\norg.gradle.jvmargs=-Xmx8192m\n"
          if "kotlin.native.incremental" not in s:
              s += "kotlin.native.incremental=false\n"
          open(p, "w", encoding="utf-8").write(s)
          GP
          grep -nE "execution.strategy|incremental|jvmargs" gradle.properties
          # Kotlin 2.4.0 -> 2.4.21：修复 markdown-renderer 在 iOS 目标上
          # 「Serialization of IrErrorType is not supported anymore」编译器内部崩溃
          python3 - <<'KV'
          for f in ("build.gradle.kts", "buildSrc/build.gradle.kts"):
              s = open(f, encoding="utf-8").read()
              n = s.replace('"2.4.0"', '"2.4.21"')
              assert n != s, "Kotlin 版本字符串未找到: " + f
              open(f, "w", encoding="utf-8").write(n)
              print("Kotlin bumped to 2.4.21 in", f)
          KV
          grep -n '2\.4\.2' build.gradle.kts buildSrc/build.gradle.kts
          # 兜底：关闭 Kotlin/Native 缓存（规避 klib 序列化类历史问题）
          grep -q "kotlin.native.cacheKind" gradle.properties || echo "kotlin.native.cacheKind=none" >> gradle.properties
          tail -2 gradle.properties
          # 【第 14 轮结论】coil 必须保持 3.5.0：只有 3.5.0 的 skiko（0.144.6）与
          # CMP 1.11.1 对齐。3.4.0 需 skiko 0.9.22.2，与 CMP 冲突 → error type →
          # IrErrorType 序列化崩溃（run 13 失败根因）。3.5.0 的 klib 由 Kotlin
          # 2.4.0 编译器产出，2.3.21 编译器读不了（KLIB resolver 错误），因此
          # 实验顺序：k2410 / k250c112 优先（klib 可读 + skiko 对齐）。
          # 规避 KT-79610 类 cinterop commonizer 崩溃：iosMain 跨 iosArm64 +
          # iosSimulatorArm64 双 target 时，CMP 的 UIKit cinterop klib 会被
          # commonizer 合并，产出损坏声明 → error type → IrErrorType 序列化崩溃。
          # 流水线当前只编 iosArm64（真机），统一移除 iosSimulatorArm64 target。
          find . -name build.gradle.kts -exec sed -i '' -E '/^[[:space:]]*iosSimulatorArm64\(\),?[[:space:]]*$/d' {} +
          echo "--- iosSimulatorArm64 移除结果 ---"
          grep -rn "iosSimulatorArm64()" --include=build.gradle.kts . || echo "已全部移除 iosSimulatorArm64 target"

      - name: 4/9 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 5/9 准备 Android SDK（AGP 配置期需要，即使只编 iOS）
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/Library/Android/sdk"
          fi
          if [ ! -d "$SDK" ]; then
            brew install --cask android-commandlinetools
            SDK="$(brew --prefix)/share/android-commandlinetools"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > src/local.properties
          SM="$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-37" > /dev/null 2>&1 || true
          fi

      - name: 6/9 编译 Kotlin/Native framework
        run: |
          set -uo pipefail
          cd src

          BC=third_party/markdown/markdown-renderer/build.gradle.kts
          IOSACT=third_party/markdown/markdown-renderer/src/iosMain/kotlin/com/hrm/markdown/renderer/selection/PersistentSelectionEngine.ios.kt

          diag() {
            log="$1"
            echo "---- What went wrong ----"
            grep -m1 -A 12 "^\* What went wrong" "$log" || echo "(none)"
            echo "---- e: 行（前 15 条） ----"
            grep -m15 "^e: " "$log" || echo "(无 e: 行)"
            echo "---- IrErrorType ----"
            grep -m2 "IrErrorType" "$log" || echo "(无)"
          }

          comp() {
            ./gradlew :markdown-renderer:compileKotlinIosArm64 > "/tmp/arm_$1.log" 2>&1
          }

          OK=0
          echo "########## A 基线编译（复现） ##########"
          if comp base; then
            echo "A: SUCCESS —— 基线已通过，无需假设矩阵"
            OK=1
          else
            echo "A: FAILED"
            diag /tmp/arm_base.log > /tmp/diag_main.txt
            cat /tmp/diag_main.txt
          fi

          cp -f "$BC" /tmp/bc.bak
          cp -f "$IOSACT" /tmp/iosact.bak

          restore_all() {
            cp -f /tmp/bc.bak "$BC"
            cp -f /tmp/iosact.bak "$IOSACT"
          }

          # 假设 1：iOS 走框架自带 SelectionContainer 是触发点（macOS/JVM/Android 都不走它）
          patch_selection() {
            cat > "$IOSACT" <<'KT'
          package com.hrm.markdown.renderer.selection

          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier

          @Composable
          internal actual fun PersistentSelectionEngine(
              modifier: Modifier,
              content: @Composable () -> Unit,
          ) {
              content()
          }
          KT
          }

          # 假设 2：material3 1.10.0-alpha05 的 iOS 构件是 legacy uikitArm64（ABI 2.2.0），
          # 与 ui/foundation 1.11.1（ABI 2.3.0）串味；换成同线的 1.11.0-alpha07（ABI 2.3.0）
          patch_material3() {
            find . -name build.gradle.kts -not -path "*/build/*" -exec sed -i '' -E 's/material3:1\.10\.0-alpha05/material3:1.11.0-alpha07/g' {} +
          }

          patch_both() {
            patch_selection
            patch_material3
          }

          WIN=""
          run_arm() {
            name="$1"
            fn="$2"
            echo "########## ARM $name ##########"
            restore_all
            "$fn"
            if comp "$name"; then
              echo "ARM $name: SUCCESS"
              WIN="$name"
              return 0
            fi
            echo "ARM $name: FAILED"
            diag "/tmp/arm_$name.log" | sed -n '1,22p'
            return 1
          }

          if [ "$OK" != "1" ]; then
            if run_arm selection patch_selection; then :; else
              if run_arm m3 patch_material3; then :; else
                run_arm both patch_both || true
              fi
            fi
            echo "$WIN" > /tmp/winner.txt
            echo "########## 假设矩阵结论：WINNER=${WIN:-(无)} ##########"
            if [ -z "$WIN" ]; then
              restore_all
              { for f in /tmp/arm_*.log; do echo; echo "########## $f"; diag "$f"; done; } > /tmp/gradle.log
              echo "编译未通过：已产出诊断日志，退出"
              exit 1
            fi
            echo "保留 WINNER=$WIN 的补丁，继续链接"
          fi

          echo "########## 链接 framework ##########"
          ./gradlew :shared:linkDebugFrameworkIosArm64 2>&1 | tee /tmp/gradle.log
          test -f shared/build/bin/iosArm64/debugFramework/shared.framework/shared

      - name: 7/9 生成 Xcode 工程
        run: |
          set -euxo pipefail
          brew install xcodegen
          cd src/iosApp
          xcodegen generate
          ls -la

      - name: 8/9 编译 App
        run: |
          set -o pipefail
          cd src
          xcodebuild \
            -project iosApp/ZhihuPlusPlus.xcodeproj \
            -scheme ZhihuPlusPlus \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log

      - name: 9/9 打包未签名 IPA
        run: |
          set -euxo pipefail
          cd src
          APP="$(find build/Build/Products -maxdepth 3 -name 'ZhihuPlusPlus.app' | head -1)"
          test -n "$APP"
          RES="$(find shared/build -type d -name 'compose-resources' 2>/dev/null | head -1 || true)"
          if [ -n "$RES" ]; then cp -R "$RES" "$APP/"; fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../ZhihuPlusPlus-unsigned.ipa Payload
          cd ..
          ls -lh ZhihuPlusPlus-unsigned.ipa
          unzip -l ZhihuPlusPlus-unsigned.ipa | head -15

      - name: 收集日志
        if: always()
        run: |
          mkdir -p logs
          cp /tmp/gradle.log logs/ 2>/dev/null || true
          cp /tmp/xcodebuild.log logs/ 2>/dev/null || true
          cp /tmp/main.log logs/ 2>/dev/null || true
          cp /tmp/deps.log logs/ 2>/dev/null || true
          cp /tmp/probe_jvm.log logs/ 2>/dev/null || true
          cp /tmp/probe_macos.log logs/ 2>/dev/null || true
          cp /tmp/arm_*.log logs/ 2>/dev/null || true
          cp /tmp/winner.txt logs/ 2>/dev/null || true
          cp /tmp/diag_*.txt logs/ 2>/dev/null || true
          echo "=== 失败摘要（若有） ==="
          grep -m 30 -E "error:|^e: |FAILURE|Undefined symbols|not found" logs/*.log 2>/dev/null || echo "(无错误关键字)"

      - name: 上传 IPA 与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZhihuPlusPlus-unsigned-ipa
          path: |
            src/ZhihuPlusPlus-unsigned.ipa
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: 发布到 Release（稳定下载通道）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete build-logs --yes --cleanup-tag 2>/dev/null || true
          gh release create build-logs --title "构建产物（自动覆盖）" --notes "每次构建覆盖：gradle.log 为最近一次诊断日志；IPA 出现即代表构建成功" || echo "CREATE_FAILED exit=$?"
          gh release upload build-logs logs/* --clobber || echo "UPLOAD_FAILED exit=$?"
          [ -f src/ZhihuPlusPlus-unsigned.ipa ] && gh release upload build-logs src/ZhihuPlusPlus-unsigned.ipa --clobber || true
          echo "=== Release 资产 ==="
          gh release view build-logs --json assets -q '.assets[].name' || echo "VIEW_FAILED exit=$?"
