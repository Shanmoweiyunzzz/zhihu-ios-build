    steps:
      - name: 1/9 拉取上游源码
        run: |
          set -euxo pipefail
          git clone --depth 1 "$UPSTREAM" src
          cd src
          REF="${{ github.event.inputs.upstream_ref }}"
          if [ -n "${REF:-}" ]; then
            git fetch --depth 1 origin "$REF" && git checkout -q FETCH_HEAD || echo "指定 ref 拉取失败，改用默认分支"
          elif git fetch --depth 1 origin "$UPSTREAM_SHA"; then
            git checkout -q FETCH_HEAD
            echo "已锚定上游提交 $UPSTREAM_SHA"
          else
            echo "锚点拉取失败，改用默认分支 HEAD"
          fi
          git log -1 --oneline
          chmod +x gradlew

      - name: 2/9 叠加 iOS 宿主层
        run: |
          set -euxo pipefail
          python3 -c "import base64,os;open('/tmp/overlay.tar.gz','wb').write(base64.b64decode(os.environ['OVERLAY_B64']))"
          tar xzf /tmp/overlay.tar.gz -C src
          echo '--- iosApp ---'
          find src/iosApp -type f | sort
          echo '--- iosMain 新增文件 ---'
          ls -l src/shared/src/iosMain/kotlin/com/github/zly2006/zhihu/MainViewController.kt \
                src/shared/src/iosMain/kotlin/com/github/zly2006/zhihu/ui/IosZhihuMain.kt \
                src/shared/src/iosMain/kotlin/com/github/zly2006/zhihu/platform/IosSettingsStore.kt

      - name: 3/9 修复「自动隐藏回答标题」失效 + 补依赖
        run: |
          set -euxo pipefail
          cd src
          F=shared/src/iosMain/kotlin/com/github/zly2006/zhihu/platform/NativePlatformBridge.ios.kt
          # 核心修复：返回 noopSettingsStore() 改为真实存储（找不到就报错，绝不静默跳过）
          python3 - "$F" <<'PATCH'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          old = "= noopSettingsStore()"
          new = "= iosSettingsStore(relativePath)"
          if old not in s:
              raise SystemExit("补丁目标未找到: " + old)
          open(p, "w", encoding="utf-8").write(s.replace(old, new))
          PATCH
          grep -n "iosSettingsStore" "$F"
          # nativeMain 用 Ktor Darwin 引擎，iOS 侧缺依赖声明，显式补上
          cat >> shared/build.gradle.kts <<'APPEND'

          // ==== iOS 宿主补丁：Darwin 引擎依赖 ====
          kotlin {
              sourceSets {
                  named("iosMain") {
                      dependencies {
                          implementation("io.ktor:ktor-client-darwin:3.5.0")
                      }
                  }
              }
          }
          APPEND
          tail -14 shared/build.gradle.kts
          # 编译策略调整：in-process 保留完整编译器输出（守护进程崩溃会吞掉真实错误），
          # 关闭 Kotlin/Native 增量编译，放大 Gradle 堆
          python3 - gradle.properties <<'GP'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          s = s.replace("kotlin.compiler.execution.strategy=daemon",
                        "kotlin.compiler.execution.strategy=in-process")
          s = s.replace("kotlin.daemon.jvmargs=-Xmx3072m",
                        "kotlin.daemon.jvmargs=-Xmx8192m")
          if "org.gradle.jvmargs" not in s:
              s += "\norg.gradle.jvmargs=-Xmx8192m\n"
          if "kotlin.native.incremental" not in s:
              s += "kotlin.native.incremental=false\n"
          open(p, "w", encoding="utf-8").write(s)
          GP
          grep -nE "execution.strategy|incremental|jvmargs" gradle.properties
          # Kotlin 2.4.0 -> 2.4.21：修复 markdown-renderer 在 iOS 目标上
          # 「Serialization of IrErrorType is not supported anymore」编译器内部崩溃
          python3 - <<'KV'
          for f in ("build.gradle.kts", "buildSrc/build.gradle.kts"):
              s = open(f, encoding="utf-8").read()
              n = s.replace('"2.4.0"', '"2.4.21"')
              assert n != s, "Kotlin 版本字符串未找到: " + f
              open(f, "w", encoding="utf-8").write(n)
              print("Kotlin bumped to 2.4.21 in", f)
          KV
          grep -n '2\.4\.2' build.gradle.kts buildSrc/build.gradle.kts
          # 兜底：关闭 Kotlin/Native 缓存（规避 klib 序列化类历史问题）
          grep -q "kotlin.native.cacheKind" gradle.properties || echo "kotlin.native.cacheKind=none" >> gradle.properties
          tail -2 gradle.properties
          # coil 3.5.0 的 iOS klib 由 Kotlin 2.4.0 编译器产出，2.3.21 编译器无法读取
          # （KLIB resolver: Could not find .../coil-compose-iosArm64Main-3.5.0.klib）。
          # 降级到 3.4.0（klib 由 Kotlin 2.3.10 产出，兼容 2.3.21 编译器）
          find . -name build.gradle.kts -exec sed -i '' -E 's/io\.coil-kt\.coil3:([a-zA-Z0-9-]+):3\.5\.0/io.coil-kt.coil3:\1:3.4.0/g' {} +
          echo "--- coil 降级结果 ---"
          grep -rn "coil3:" --include=build.gradle.kts . | grep "3\.5\.0" || echo "coil 3.5.0 已全部替换为 3.4.0"

      - name: 4/9 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 5/9 准备 Android SDK（AGP 配置期需要，即使只编 iOS）
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/Library/Android/sdk"
          fi
          if [ ! -d "$SDK" ]; then
            brew install --cask android-commandlinetools
            SDK="$(brew --prefix)/share/android-commandlinetools"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > src/local.properties
          SM="$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-37" > /dev/null 2>&1 || true
          fi

      - name: 6/9 编译 Kotlin/Native framework
        run: |
          set -uo pipefail
          cd src
          diag() {
            log="$1"
            echo "---- head(2k) ----"
            head -c 2000 "$log"
            echo ""
            echo "---- What went wrong ----"
            grep -m1 -A 25 "^\* What went wrong" "$log" || echo "(none)"
            echo "---- Caused by ----"
            grep -m8 -A2 "Caused by" "$log" || echo "(none)"
          }
          exp() {
            name="$1"
            echo "===== EXP $name ====="
            if ./gradlew :markdown-renderer:compileKotlinIosArm64 > "/tmp/exp_$name.log" 2>&1; then
              echo "EXP $name: SUCCESS"
              echo "$name" > /tmp/winner
              return 0
            fi
            if grep -q "KLIB resolver: Could not find" "/tmp/exp_$name.log"; then
              echo "EXP $name: KLIB 缺失，清理 coil 缓存后带 --refresh-dependencies 重试"
              rm -rf "$HOME/.gradle/caches/modules-2/files-2.1/io.coil-kt.coil3"
              if ./gradlew --refresh-dependencies :markdown-renderer:compileKotlinIosArm64 > "/tmp/exp_${name}_retry.log" 2>&1; then
                echo "EXP $name: SUCCESS (after refresh)"
                echo "$name" > /tmp/winner
                return 0
              fi
              cp "/tmp/exp_${name}_retry.log" "/tmp/exp_$name.log"
            fi
            echo "EXP $name: FAILED"
            echo "---- e: lines ----"
            grep -m15 "^e: " "/tmp/exp_$name.log" || echo "(no e: lines)"
            grep -m3 "IrErrorType" "/tmp/exp_$name.log" || echo "(no IrErrorType)"
            diag "/tmp/exp_$name.log" | tee "/tmp/diag_$name.txt"
            return 1
          }
          reset() { git checkout -q -- build.gradle.kts buildSrc/build.gradle.kts; }
          setv() {
            sed -i '' -E -e 's/kotlin\(("[a-zA-Z.]+")\) version "[^"]+"/kotlin(\1) version "'"$1"'"/g' build.gradle.kts buildSrc/build.gradle.kts
            if [ "$2" != "keep" ]; then
              sed -i '' -e "s/org.jetbrains.compose\") version \"[0-9.]*\"/org.jetbrains.compose\") version \"$2\"/" build.gradle.kts
            fi
            echo "--- setv $1 $2 ---"
            grep -n "kotlin(\"\|org.jetbrains.compose" build.gradle.kts | head -6
          }
          WIN=""
          rm -rf "$HOME/.gradle/caches/modules-2/files-2.1/io.coil-kt.coil3"
          reset; setv 2.3.21 keep
          exp k2321 && WIN=k2321
          if [ -z "$WIN" ]; then
            reset; setv 2.4.10 keep
            exp k2410 && WIN=k2410
          fi
          if [ -z "$WIN" ]; then
            reset; setv 2.5.0-Beta1 1.12.2
            exp k250c112 && WIN=k250c112
          fi
          echo "WINNER=$WIN"
          if [ -z "$WIN" ]; then
            echo "所有版本实验均失败"
            { for f in /tmp/exp_*.log; do echo; echo "########## $f"; diag "$f"; done; } > /tmp/gradle.log
            exit 1
          fi
          ./gradlew :shared:linkDebugFrameworkIosArm64 2>&1 | tee /tmp/gradle.log
          test -f shared/build/bin/iosArm64/debugFramework/shared.framework/shared

      - name: 7/9 生成 Xcode 工程
        run: |
          set -euxo pipefail
          brew install xcodegen
          cd src/iosApp
          xcodegen generate
          ls -la

      - name: 8/9 编译 App
        run: |
          set -o pipefail
          cd src
          xcodebuild \
            -project iosApp/ZhihuPlusPlus.xcodeproj \
            -scheme ZhihuPlusPlus \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log

      - name: 9/9 打包未签名 IPA
        run: |
          set -euxo pipefail
          cd src
          APP="$(find build/Build/Products -maxdepth 3 -name 'ZhihuPlusPlus.app' | head -1)"
          test -n "$APP"
          RES="$(find shared/build -type d -name 'compose-resources' 2>/dev/null | head -1 || true)"
          if [ -n "$RES" ]; then cp -R "$RES" "$APP/"; fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../ZhihuPlusPlus-unsigned.ipa Payload
          cd ..
          ls -lh ZhihuPlusPlus-unsigned.ipa
          unzip -l ZhihuPlusPlus-unsigned.ipa | head -15

      - name: 收集日志
        if: always()
        run: |
          mkdir -p logs
          cp /tmp/gradle.log logs/ 2>/dev/null || true
          cp /tmp/xcodebuild.log logs/ 2>/dev/null || true
          echo "=== 失败摘要（若有） ==="
          grep -m 30 -E "error:|^e: |FAILURE|Undefined symbols|not found" logs/*.log 2>/dev/null || echo "(无错误关键字)"

      - name: 上传 IPA 与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZhihuPlusPlus-unsigned-ipa
          path: |
            src/ZhihuPlusPlus-unsigned.ipa
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: 发布到 Release（稳定下载通道）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-logs --yes --cleanup-tag 2>/dev/null || true
          gh release create build-logs --title "构建产物（自动覆盖）" --notes "每次构建覆盖：gradle.log 为最近一次诊断日志；IPA 出现即代表构建成功" || true
          gh release upload build-logs logs/gradle.log --clobber 2>/dev/null || true
          [ -f src/ZhihuPlusPlus-unsigned.ipa ] && gh release upload build-logs src/ZhihuPlusPlus-unsigned.ipa --clobber || true
          gh release view build-logs --json assets -q '.assets[].name' || true
